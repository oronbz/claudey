id = "shepherd"
name = "Shepherd"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Wake the Shepherd desktop companion and point him at this Herdr session."
platforms = ["macos"]

[[build]]
command = ["bash", "shepherd-install-app.sh"]

[[startup]]
command = ["bash", "shepherd-connect.sh"]

[[actions]]
id = "connect"
title = "Connect Shepherd"
description = "Start the companion if needed and connect him to this Herdr session."
contexts = ["global"]
command = ["bash", "shepherd-connect.sh", "--connect"]
